name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm test
      - run: npx node-pg-migrate up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: kubectl apply -f deploy/manifest.yaml
