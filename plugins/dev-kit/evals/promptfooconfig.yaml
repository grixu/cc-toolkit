# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: dev-kit plugin — dep-upgrade-check security gate (advisories, malware, cooldown, PR comment)

prompts:
  - id: file://prompts/check.txt
    label: security-gate

providers:
  - id: file://provider.mjs
    label: dev-kit
    config:
      apiKeyRequired: false
      model: '{{ env.EVAL_TARGET_MODEL | default("claude-opus-5-5") }}'
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      working_dir: ../../..
      max_budget_usd: 3
      # The provider enables only read-only tools unless told otherwise, and the gate runs on Bash.
      allow_all_tools: true
      plugins:
        - type: local
          # Resolved relative to this config file, not to working_dir.
          path: ..
      skills: all
      setting_sources: []
      settings: ../../../scripts/evals-isolation.json
      # Questions get the first option unless a test names its answer in vars.answer.

tests:
  - description: 'escalated-direct: lodash 4.17.15 → 4.17.21 keeps three advisories; reachability informs, never lowers'
    vars:
      input: lodash@4.17.21
      checkout: plugins/dev-kit/evals/.sandbox/escalated-direct
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
    assert:
      - type: javascript
        value: file://checks/security.mjs:escalatedDirect

  - description: 'blocked-malware: axios 1.14.1 is malware the registry took down'
    vars:
      input: axios@1.14.1
      checkout: plugins/dev-kit/evals/.sandbox/blocked-malware
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
    assert:
      - type: javascript
        value: file://checks/security.mjs:blockedMalware

  - description: 'blocked-cooldown: a release under 7 days old that fixes nothing'
    vars:
      # Written by reset-sandbox.sh, which picks a currently fresh release.
      input: file://.sandbox/blocked-cooldown-input.txt
      checkout: plugins/dev-kit/evals/.sandbox/blocked-cooldown
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
    assert:
      - type: javascript
        value: file://checks/security.mjs:blockedCooldown

  - description: 'cooldown-exempt: a release under 7 days old that fixes an advisory of current passes the cooldown'
    vars:
      # Written by reset-sandbox.sh, which picks a fresh release that patches a recent advisory.
      input: file://.sandbox/cooldown-exempt-input.txt
      checkout: plugins/dev-kit/evals/.sandbox/cooldown-exempt
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
    assert:
      - type: javascript
        value: file://checks/security.mjs:cooldownExempt

  - description: 'pr-clear-private: a clear PR still gets the comment; the private package is never sent out'
    vars:
      input: https://github.com/example/web/pull/11
      checkout: plugins/dev-kit/evals/.sandbox/pr-clear-private
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
    assert:
      - type: javascript
        value: file://checks/security.mjs:prClearPrivate

  - description: 'pr-transitive-rerun: a vulnerable transitive minimist escalates; the existing comment is updated'
    vars:
      input: https://github.com/example/web/pull/12
      checkout: plugins/dev-kit/evals/.sandbox/pr-transitive-rerun
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
    assert:
      - type: javascript
        value: file://checks/security.mjs:prTransitiveRerun

  - description: 'pr-escalated-accept: the user accepts the risk; the comment records it and the target stays'
    vars:
      input: https://github.com/example/web/pull/13
      checkout: plugins/dev-kit/evals/.sandbox/pr-escalated-accept
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
      answer: '^accept'
    assert:
      - type: javascript
        value: file://checks/security.mjs:prEscalatedAccept

  - description: 'pr-merge-checkout: on the merge commit the current version still comes from the base lockfile'
    vars:
      input: https://github.com/example/web/pull/14
      checkout: plugins/dev-kit/evals/.sandbox/pr-merge-checkout
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
      answer: '^accept'
    assert:
      - type: javascript
        value: file://checks/security.mjs:prMergeCheckout

  - description: 'pr-upsert-installation-token: no GET /user; the bot updates its own comment, not another bot''s'
    vars:
      input: https://github.com/example/web/pull/15
      checkout: plugins/dev-kit/evals/.sandbox/pr-upsert-installation-token
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
      answer: '^accept'
      env:
        GH_STANDIN_INSTALLATION_TOKEN: '1'
    assert:
      - type: javascript
        value: file://checks/security.mjs:prUpsertInstallationToken

  - description: 'pr-unattended-escalated: no question; the comment goes out at once with a pending Decision'
    vars:
      input: https://github.com/example/web/pull/16 unattended
      checkout: plugins/dev-kit/evals/.sandbox/pr-unattended-escalated
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
    assert:
      - type: javascript
        value: file://checks/security.mjs:prUnattendedEscalated

  - description: 'pr-unattended-env: GITHUB_ACTIONS=true switches on unattended without the token'
    vars:
      input: https://github.com/example/web/pull/18
      checkout: plugins/dev-kit/evals/.sandbox/pr-unattended-env
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
      env:
        GITHUB_ACTIONS: 'true'
    assert:
      - type: javascript
        value: file://checks/security.mjs:prUnattendedEnv

  - description: 'pr-unattended-carry: the bot carries a maintainer''s decision for the same advisories, never a stranger''s'
    vars:
      input: https://github.com/example/web/pull/17 unattended
      checkout: plugins/dev-kit/evals/.sandbox/pr-unattended-carry
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
      env:
        GH_STANDIN_INSTALLATION_TOKEN: '1'
    assert:
      - type: javascript
        value: file://checks/security.mjs:prUnattendedCarry

  - description: 'pr-unattended-stop: a PR from another repository stops instead of asking for a checkout'
    vars:
      input: https://github.com/other/lib/pull/5 unattended
      checkout: plugins/dev-kit/evals/.sandbox/escalated-direct
      gh: plugins/dev-kit/evals/.sandbox/bin/gh
    assert:
      - type: javascript
        value: file://checks/security.mjs:prUnattendedStop
