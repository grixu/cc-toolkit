<svg viewBox="0 0 800 280" role="img" aria-label="States an audit run moves through">
  <rect class="fx-bg" width="800" height="280"/>

  <path class="fx-edge" d="M 184,112 L 296,112"/>
  <text class="fx-edge-label" x="240" y="100" text-anchor="middle">start()</text>
  <path class="fx-edge" d="M 472,112 L 584,112"/>
  <text class="fx-edge-label" x="528" y="100" text-anchor="middle"><tspan data-lang="en">all pages</tspan><tspan data-lang="pl">wszystkie strony</tspan></text>
  <path class="fx-edge add" d="M 384,136 L 384,184"/>
  <text class="fx-edge-label" x="394" y="166">timeout</text>

  <rect class="fx-node" x="40" y="88" width="144" height="48" rx="24"/>
  <text class="fx-label" x="112" y="117" text-anchor="middle">queued</text>
  <rect class="fx-node key" x="296" y="88" width="176" height="48" rx="24"/>
  <text class="fx-label" x="384" y="117" text-anchor="middle">running</text>
  <rect class="fx-node" x="584" y="88" width="160" height="48" rx="24"/>
  <text class="fx-label" x="664" y="117" text-anchor="middle">finished</text>
  <rect class="fx-node add" x="296" y="184" width="176" height="48" rx="24"/>
  <text class="fx-label" x="384" y="213" text-anchor="middle">expired</text>
  <text class="fx-sub" x="384" y="252" text-anchor="middle"><tspan data-lang="en">new in this change</tspan><tspan data-lang="pl">nowy w tej zmianie</tspan></text>
</svg>
