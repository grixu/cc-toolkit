# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: code-review plugin — comment verdicts (R1–R12) and quality findings (family · rule · severity)

prompts:
  # Natural-language triggers (not literal "/comment-review" slashes — the Agent SDK reads a
  # leading "/" as a command and rejects it; the skills fire on description match instead).
  # Each test binds to one label, so the two tracks don't cross-run.
  - id: file://prompts/review.txt
    label: comment-track
  - id: file://prompts/quality.txt
    label: quality-track
  # Scanner track: the security / performance / spec lenses have no standalone skill (they
  # exist only inside /start-cr), so these prompts emulate the orchestrator's Scanner
  # brief — read the rules file, review the file, return findings only.
  - id: file://prompts/security.txt
    label: security-track
  - id: file://prompts/performance.txt
    label: performance-track
  - id: file://prompts/security-diff.txt
    label: security-diff-track
  - id: file://prompts/spec.txt
    label: spec-track
  # Standards track: quality-review with the fixture dir declared as the repository root
  # for the CODING_STANDARDS pair.
  - id: file://prompts/standards.txt
    label: standards-track
  # Headless track: the three model-only skills a workflow drives, run in sequence against a
  # committed change in a git sandbox that reset-sandbox.sh rebuilds.
  - id: file://prompts/headless.txt
    label: headless-track
  - id: file://prompts/headless-prepare.txt
    label: headless-prepare-track
  - id: file://prompts/headless-list.txt
    label: headless-list-track
  # The correctness lens, briefed like the other scanner-only lenses.
  - id: file://prompts/correctness.txt
    label: correctness-track
  # start-cr's Step 1 for --pr, against a sandbox origin and a gh stand-in.
  - id: file://prompts/pr-scope.txt
    label: pr-track

providers:
  - id: anthropic:claude-agent-sdk # alias: anthropic:claude-code
    label: code-review
    config:
      apiKeyRequired: false # use the local Claude Code subscription, no API key for the target
      model: claude-opus-5-5 # the model users run; a capable model is needed for evals 3/4 to pass
      permission_mode: bypassPermissions # the skill's Read/Grep/Bash run unattended
      allow_dangerously_skip_permissions: true # required alongside bypassPermissions
      working_dir: ../../.. # repo root, so the plugin path and {{file}} paths resolve
      # Per-run cost guard. The quality track needs the higher cap: quality-review reads
      # four rules files plus severity.md and scope.md before it judges, and a $1 cap
      # aborted the calibration test mid-run with an empty result.
      max_budget_usd: 3
      plugins:
        - type: local
          # Resolved relative to THIS config file, not to working_dir: `plugins/code-review`
          # silently loads nothing (no skills, no findings vocabulary) under SDK 0.3.252.
          path: ..
      skills: all
      setting_sources: [] # keep this repo's CLAUDE.md / hooks OUT of the eval
      ask_user_question:
        behavior: first_option # file-path mode shouldn't prompt, but never block if it does

defaultTest:
  options:
    # Grader for llm-rubric. No ANTHROPIC_API_KEY in this environment, so grade on the
    # subscription via the agent SDK (single-turn, no tools). For a faster/cheaper grader,
    # set ANTHROPIC_API_KEY and replace this with:  provider: anthropic:messages:claude-opus-4-8
    provider:
      id: anthropic:claude-agent-sdk
      config:
        apiKeyRequired: false
        model: claude-opus-5-5
        max_turns: 1
        # Without the JSON-only pin the grader occasionally wraps the verdict in prose and
        # promptfoo cannot extract the JSON.
        append_system_prompt: >-
          You are being used as an automated grader. Reply with ONLY the JSON object the
          grading instructions ask for — no prose before or after it, no code fences.

tests:
  # ============================================================================
  # Comment track — comment-review, verdicts R1–R12
  # ============================================================================

  - description: 'eval-0 banners-and-doc-refs (datadog-integration.tf)'
    prompts: [comment-track]
    vars:
      file: plugins/code-review/evals/fixtures/datadog-integration.tf
    assert:
      # "skill actually ran" proxy: plugin skills load via Agent-Skills injection, not a
      # Skill() tool call, so `skill-used` / metadata.skillCalls stay empty. Assert the
      # report closes on the skill's own tally line instead.
      - type: regex
        value: '\*\*Tally:\*\* \d+ comments reviewed · \d+ remove · \d+ rewrite · \d+ move · \d+ add · \d+ keep-as-is'
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: '# ===== Datadog =====', verdict: REMOVE, rule: R5 }
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: '# ----- Provider credentials -----', verdict: REMOVE, rule: R5 }
      # a descriptive title does not redeem the fence
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: '# ----- DD GCP integration', verdict: REMOVE, rule: R5 }
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: '# ----- Metric namespaces -----', verdict: REMOVE, rule: R5 }
      # internal-doc reference
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: 'DD_ARCH.md §3.2', verdict: [REMOVE, REWRITE, MOVE], rule: R4 }
      # the rationale survives, so the verdict rewrites rather than removes
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: 'DD_PLAN.md T4.1', verdict: [REWRITE, MOVE], rule: R4 }
      - type: javascript
        value: file://checks/report.mjs:replacementsOmit
        config: { quote: 'DD_PLAN.md T4.1', tokens: [DD_PLAN, T4.1] }
      - type: llm-rubric
        value: >-
          The replacement the report proposes for the `DD_PLAN.md T4.1` comment keeps
          its rationale: the per-env hard-stop on `host_filters` is deliberate.
      # R4 external-pinned-spec exception
      - type: javascript
        value: file://checks/report.mjs:commentKept
        config: { quote: 'RFC 9110 §10.2.3', forbid: [REMOVE] }
      - type: javascript
        value: file://checks/report.mjs:commentKept
        config: { quote: 'gke and cloudsql emit', forbid: [REMOVE] }

  # ----------------------------------------------------------------------------
  - description: 'eval-1 file-refs-and-diagram (scheduler.ts)'
    prompts: [comment-track]
    vars:
      file: plugins/code-review/evals/fixtures/scheduler.ts
    assert:
      - type: regex
        value: '\*\*Tally:\*\* \d+ comments reviewed · \d+ remove · \d+ rewrite · \d+ move · \d+ add · \d+ keep-as-is'
      # cross-file / internal-doc references
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: 'utils/backoff.ts', verdict: [REMOVE, REWRITE, MOVE], rule: R4 }
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: '// ----- helpers -----', verdict: REMOVE, rule: R5 }
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: '// ===== Scheduler =====', verdict: REMOVE, rule: R5 }
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: '// increment the attempt counter', verdict: REMOVE, rule: R1 }
      # the R5 exception for a diagram that encodes information
      - type: javascript
        value: file://checks/report.mjs:commentKept
        config: { quote: 'IDLE' }
      # a genuine decision (R2)
      - type: javascript
        value: file://checks/report.mjs:commentKept
        config: { quote: 'Sequential, not parallel' }
      # R4 external exception
      - type: javascript
        value: file://checks/report.mjs:commentKept
        config: { quote: 'CVE-2024-1234', forbid: [REMOVE] }

  # ----------------------------------------------------------------------------
  - description: 'eval-2 misplaced-and-duplicated-rationale (dlq-codes.ts + dlq.handler.ts)'
    prompts: [comment-track]
    vars:
      file: plugins/code-review/evals/fixtures/dlq-codes.ts plugins/code-review/evals/fixtures/dlq.handler.ts
    assert:
      - type: regex
        value: '\*\*Tally:\*\* \d+ comments reviewed · \d+ remove · \d+ rewrite · \d+ move · \d+ add · \d+ keep-as-is'
      # rationale parked on a declaration
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: "conditional UPDATE can't distinguish", file: dlq-codes.ts, verdict: [REMOVE, REWRITE, MOVE], rule: R12 }
      # the handler already holds the same rationale, so the declaration copy goes
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: "conditional UPDATE can't distinguish", file: dlq-codes.ts, verdict: REMOVE }
      # the rationale lives only at the declaration, so it moves rather than goes
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: 'we swallow the duplicate', verdict: MOVE }
      # the destination is the handler method
      - type: javascript
        value: file://checks/report.mjs:commentFix
        config: { quote: 'we swallow the duplicate', pattern: '\bhandle\b' }
      # a value-meaning note stays on the value (R12 contrast)
      - type: javascript
        value: file://checks/report.mjs:commentKept
        config: { quote: '0 means unbounded, not disabled' }
      # the genuine WHY where the behaviour lives (R2)
      - type: javascript
        value: file://checks/report.mjs:commentKept
        config: { quote: "conditional UPDATE can't distinguish", file: dlq.handler.ts }
      - type: javascript
        value: file://checks/report.mjs:commentNotFlagged
        config: { mentions: [DLQ_MESSAGE_RECEIVED, DLQ_REQUEUED] }

  # ----------------------------------------------------------------------------
  - description: 'eval-3 spec-id-references (payment-validator.ts)'
    prompts: [comment-track]
    vars:
      file: plugins/code-review/evals/fixtures/payment-validator.ts
    assert:
      - type: regex
        value: '\*\*Tally:\*\* \d+ comments reviewed · \d+ remove · \d+ rewrite · \d+ move · \d+ add · \d+ keep-as-is'
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: 'F1: users can submit', verdict: REMOVE, rule: R4 }
      # a pure spec-id pointer; nothing survives stripping it
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: '// see Q1', verdict: REMOVE, rule: R4 }
      # both are defensible: once `§4.1` is stripped the rest borders on R1 narration of
      # MAX_CHARGE_MINOR_UNITS + its guard; only keeping it as-is fails
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: '§4.1 caps a single charge', verdict: [REWRITE, REMOVE], rule: R4 }
      - type: javascript
        value: file://checks/report.mjs:replacementsOmit
        config: { quote: '§4.1 caps a single charge', tokens: ['§4.1', '4.1'] }
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: 'R7: charge in source order', verdict: REWRITE, rule: R4 }
      # the `R7` token itself is the suite-wide replacementsOmit below
      - type: javascript
        value: file://checks/report.mjs:commentFix
        config: { quote: 'R7: charge in source order', in: replacement, pattern: 'out-of-order|source order|sequence' }
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: 'Implements AC-3 and AC-4', verdict: REMOVE, rule: R4 }
      - type: javascript
        value: file://checks/report.mjs:commentKept
        config: { quote: 'Retry-After handling per RFC 9110', forbid: [REMOVE] }
      # `R2` is the real value of `const REGION = "R2"`, not a spec-id
      - type: javascript
        value: file://checks/report.mjs:commentKept
        config: { quote: 'region R2 is EU-only' }
      # a genuine WHY (R2)
      - type: javascript
        value: file://checks/report.mjs:commentKept
        config: { quote: 'sequential, not parallel' }
      # only the replacement text counts; quoting the original comment is fine
      - type: javascript
        value: file://checks/report.mjs:replacementsOmit
        config: { tokens: [F1, Q1, AC-3, AC-4, '§4.1', R7] }

  # ----------------------------------------------------------------------------
  - description: 'eval-4 spec-id-embedded-midsentence (host-allowlist.ts)'
    prompts: [comment-track]
    vars:
      file: plugins/code-review/evals/fixtures/host-allowlist.ts
    assert:
      - type: regex
        value: '\*\*Tally:\*\* \d+ comments reviewed · \d+ remove · \d+ rewrite · \d+ move · \d+ add · \d+ keep-as-is'
      # each carries a real WHY: neither a blanket REMOVE nor KEEP-as-is
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: ['We lowercase the host', 'Per Q4 the cache TTL', 'Validate in two passes'], verdict: REWRITE }
      - type: javascript
        value: file://checks/report.mjs:replacementsOmit
        config: { tokens: [R2, F3, Q4, '§2.3', '§2.4'] }
      - type: llm-rubric
        value: >-
          The ordering / failure-mode rationale of each comment is preserved in its rewrite
          (the WHY survives; only the spec-id token is stripped).
      # bare R1 narration
      - type: javascript
        value: file://checks/report.mjs:commentVerdict
        config: { quote: 'hosts are matched case-insensitively', verdict: REMOVE }
      - type: llm-rubric
        value: >-
          The reasoning checks whether each token is a real code value before stripping it,
          rather than rationalizing the spec-id `R2` as a code value.

  # ============================================================================
  # Quality track — quality-review, findings tagged family · rule · severity
  # ============================================================================

  - description: 'eval-5 vocabulary-and-skeleton (quality-vocabulary.ts)'
    prompts: [quality-track]
    vars:
      file: plugins/code-review/evals/fixtures/quality-vocabulary.ts
    assert:
      # "skill actually ran" proxy: the report uses the skill's own family vocabulary.
      - type: regex
        value: '`(readability|tests|naming|module|objects|patterns|simplicity|security|performance|spec|standards)\b'
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: simplicity, rule: dead-code, mentions: placedIso }
      # not downgraded because the file is otherwise small, tidy or correct
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: simplicity, rule: dead-code, mentions: placedIso, severity: high }
      - type: javascript
        value: file://checks/report.mjs:findingsVocabulary
        config: { severities: [high, medium, nit] }
      # one rule breaking at several sites is one bullet listing the lines
      - type: javascript
        value: file://checks/report.mjs:collapsedRepeats
        config: { rule: openness }
      # a high finding exists, so the headline must not call the change clean
      - type: javascript
        value: file://checks/report.mjs:headlineHonest
        config: {}
      - type: javascript
        value: file://checks/report.mjs:skeletonPreamble
      - type: javascript
        value: file://checks/report.mjs:fileHeaders
      - type: javascript
        value: file://checks/report.mjs:findingBullets
      - type: javascript
        value: file://checks/report.mjs:noCodeBlocks

  # ----------------------------------------------------------------------------
  - description: 'eval-6 recall-across-families (quality-recall.ts)'
    prompts: [quality-track]
    vars:
      file: plugins/code-review/evals/fixtures/quality-recall.ts
    assert:
      - type: regex
        value: '`(readability|tests|naming|module|objects|patterns|simplicity|security|performance|spec|standards)\b'
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: simplicity, rule: over-complex, mentions: [renderInvoiceLine, renderCreditNoteLine, 'INVOICE', 'CREDIT NOTE'], severity: high }
      # the fix collapses both into one function taking the label
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: simplicity, rule: over-complex, mentions: [renderInvoiceLine, renderCreditNoteLine, 'INVOICE', 'CREDIT NOTE'], fix: 'label|param' }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: readability, rule: magic-literal, mentions: ['86400', findOverdueInvoices], severity: medium }
      # the fix proposes a name for the 30-day overdue window
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: readability, rule: magic-literal, mentions: ['86400', findOverdueInvoices], fix: '`\w*(overdue|window|days)\w*`' }
      # the name carries the type (`Map`), not the role
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: naming, rule: role-name, mentions: currencyMap, severity: nit }

  # ----------------------------------------------------------------------------
  - description: 'eval-7 calibration-look-alikes (quality-calibration.ts)'
    prompts: [quality-track]
    vars:
      file: plugins/code-review/evals/fixtures/quality-calibration.ts
    assert:
      # This fixture is deliberately clean, so a family tag may be absent from a collapsed
      # report. Use the skeleton's tally line as the "skill actually ran" proxy instead.
      - type: regex
        value: '\*\*Tally:\*\* \d+ findings? · \d+ high · \d+ medium · \d+ nit'
      # narrowing an `unknown` boundary is the documented exception
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: needless-cast, mentions: ['JSON\.parse', parseConfig, 'as Config'] }
      # an exhaustive default kept as a defensive assertion
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: dead-code, mentions: [default, area] }
      # arithmetic that is self-evidently itself
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: magic-literal, mentions: [median, 'Math\.floor', '% 2', middle] }
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: explaining-variable, mentions: [hasResults, 'items\.length'] }
      # both arms do comparable work: a legitimate if/else
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: guard-clause, mentions: describeStock }
      - type: javascript
        value: file://checks/report.mjs:cleanVerdict
        config: {}
      - type: javascript
        value: file://checks/report.mjs:notFlaggedNames
        config: { patterns: ['JSON\.parse|parseConfig|as Config', 'default|area', 'median', 'hasResults|items\.length', describeStock], min: 1 }

  # ----------------------------------------------------------------------------
  - description: 'eval-8 folded-rules-recall (quality-recall-2.ts + quality-recall-2.model.ts)'
    prompts: [quality-track]
    vars:
      file: plugins/code-review/evals/fixtures/quality-recall-2.ts plugins/code-review/evals/fixtures/quality-recall-2.model.ts
    assert:
      - type: regex
        value: '`(readability|tests|naming|module|objects|patterns|simplicity|security|performance|spec|standards)\b'
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: module, rule: pass-through, mentions: fetchInvoice, severity: medium }
      # the fix inlines the call at the caller and deletes the wrapper
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: module, rule: pass-through, mentions: fetchInvoice, fix: '^(?=.*inline)(?=.*(delete|remov))' }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: module, rule: canonical-helper, mentions: renderAmount, severity: high }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: module, rule: canonical-helper, mentions: renderAmount, fix: formatMoney }
      # `over-complex` is for same-file duplication
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: over-complex, mentions: [renderAmount, formatMoney] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: objects, rule: feature-envy, mentions: [totalOf, priorityOf, labelFor], severity: medium }
      # the fix moves the computation onto `Invoice`
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: objects, rule: feature-envy, mentions: [totalOf, priorityOf, labelFor], fix: 'Invoice|total\(\)|daysOverdue' }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: objects, rule: message-chain, mentions: [recipientFor, primaryContact], severity: medium }
      # the fix asks `Invoice` or `Customer` for the answer
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: objects, rule: message-chain, mentions: [recipientFor, primaryContact], fix: 'Invoice|Customer' }

  # ----------------------------------------------------------------------------
  - description: 'eval-9 folded-rules-calibration (quality-calibration-2.ts + quality-calibration-2.types.ts)'
    prompts: [quality-track]
    vars:
      file: plugins/code-review/evals/fixtures/quality-calibration-2.ts plugins/code-review/evals/fixtures/quality-calibration-2.types.ts
    assert:
      # Deliberately clean fixture — proxy on the skeleton's tally line, as in eval-7.
      - type: regex
        value: '\*\*Tally:\*\* \d+ findings? · \d+ high · \d+ medium · \d+ nit'
      # a DTO mapper reads another object because that is its job
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: feature-envy, mentions: [toDto, OrderDtoMapper] }
      # a fluent, this-returning builder
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: message-chain, mentions: [OrderQuery, 'where\(', 'build\(', list, find] }
      # it adapts the call at a real boundary: a facade
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: pass-through, mentions: [chargeOrder, PaymentGateway] }
      # the fixture has one cross-file import pair, erased and type-only
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: dependency-direction }
      # a framework-fixed signature
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: data-clump, mentions: ['req', Request, 'res\b'] }
      - type: javascript
        value: file://checks/report.mjs:cleanVerdict
        config: {}
      - type: javascript
        value: file://checks/report.mjs:notFlaggedNames
        config: { patterns: ['toDto|OrderDtoMapper', 'OrderQuery|builder', 'chargeOrder|PaymentGateway', 'import type|type-only', 'data-clump|\(req|req: Request|Request, Response'], min: 1 }

  # ============================================================================
  # Scanner track — security / performance / spec, prompts that emulate the
  # /start-cr Scanner brief (these lenses have no standalone skill)
  # ============================================================================

  - description: 'eval-10 security-recall (security-recall.ts)'
    prompts: [security-track]
    vars:
      file: plugins/code-review/evals/fixtures/security-recall.ts
    assert:
      # "scanner actually ran" proxy: findings carry the lens's own family tag.
      - type: regex
        value: '`security`'
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: secret-in-source, mentions: [sk_live, STRIPE_SECRET], severity: high, lines: [7] }
      # the fix reads the value from the environment or a secret module
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: secret-in-source, mentions: [sk_live, STRIPE_SECRET], fix: 'env|secret' }
      - type: llm-rubric
        value: >-
          The `secret-in-source` finding on the `sk_live_…` literal says that rotating
          the committed value is the user's step, and never claims the rotation is done.
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: injection-sink, mentions: [listOrders, 'req\.query\.status', 'pool\.query'], severity: high }
      # both ends by line: the source at L12, the sink at L13
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: injection-sink, mentions: [listOrders, 'req\.query\.status', 'pool\.query'], lines: [12, 13] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: injection-sink, mentions: [listOrders, 'req\.query\.status', 'pool\.query'], fix: '\$1|placeholder|parameteri[sz]|bind' }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: insecure-setting, mentions: rejectUnauthorized, severity: high, lines: [9] }
      # it names the request the setting weakens
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: insecure-setting, mentions: rejectUnauthorized, all: ['api\.stripe\.com|https\.request'] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: insecure-setting, mentions: rejectUnauthorized, fix: 'rejectUnauthorized|verif|certificate' }
      # a security finding is never `nit`
      - type: javascript
        value: file://checks/report.mjs:findingsVocabulary
        config: { severities: [high, medium] }
      # CANDIDATES and HANDOFF have their own shapes, so only the findings are held to this one
      - type: javascript
        value: file://checks/report.mjs:findingShape
        config: { family: security, pattern: '^- `security` · [a-z]+(-[a-z]+)* · (high|medium) · `?[\w./-]*:?L\d+.* — .+ → .+' }
      - type: javascript
        value: file://checks/report.mjs:noCodeBlocks
        config: { scope: findings }

  # ----------------------------------------------------------------------------
  - description: 'eval-11 security-calibration (security-calibration.ts)'
    prompts: [security-track]
    vars:
      file: plugins/code-review/evals/fixtures/security-calibration.ts
    assert:
      # Clean fixture — the prompt asks for a `Not flagged:` line, so proxy on it.
      - type: regex
        value: '[Nn]ot flagged'
      # a parameterized builder with a bound `?` is the documented exception
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: injection-sink, mentions: [findUserByEmail, 'db\.raw', 'email = \?'] }
      # `spawn` with an argv array and no shell is the documented exception
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: injection-sink, mentions: [spawn, resizeUpload] }
      # an obviously fake `sk_test_` fixture value is the documented exception
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: secret-in-source, mentions: [sk_test, stripeTestKey] }
      # an environment read is the documented exception
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: secret-in-source, mentions: [SENDGRID, sendgridKey] }
      # a deliberately public health endpoint is the documented exception
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: missing-access-check, mentions: health }
      # a CANDIDATES entry for the `sk_test_` literal is tolerated, a finding is not
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { family: security }
      - type: javascript
        value: file://checks/report.mjs:notFlaggedNames
        config: { patterns: ['db\.raw|findUserByEmail', 'spawn|resizeUpload', 'sk_test|stripeTestKey', 'SENDGRID|sendgridKey', health], min: 1 }

  # ----------------------------------------------------------------------------
  - description: 'eval-12 performance-recall (performance-recall.ts)'
    prompts: [performance-track]
    vars:
      file: plugins/code-review/evals/fixtures/performance-recall.ts
    assert:
      - type: regex
        value: '`performance`'
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: performance, rule: n-plus-one, mentions: [findUnique, pendingOrdersWithCustomers], severity: high }
      # the multiplier, the call inside it and the batch API, by name
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: performance, rule: n-plus-one, mentions: findUnique, all: ['order\.findMany', findUnique, 'customersByIds|\bin\b|include'] }
      - type: llm-rubric
        value: >-
          The `n-plus-one` finding on `pendingOrdersWithCustomers` names the bound that
          is missing: one batched read of the customers before the loop.
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: performance, rule: unbounded-fetch, mentions: [listEvents, 'event\.findMany'], severity: medium }
      # the fix adds `take` plus a cursor or page parameter
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: performance, rule: unbounded-fetch, mentions: [listEvents, 'event\.findMany'], fix: '^(?=.*\btake\b)(?=.*(cursor|page))' }
      - type: llm-rubric
        value: >-
          The `unbounded-fetch` finding on `listEvents` says why the read is unbounded:
          the table grows, and the list endpoint accepts no page parameter.
      - type: javascript
        value: "!/could be slow|may impact performance|might not scale|performance impact/i.test(output)"
      # An estimate the file cannot back: a latency, a row count, a complexity class.
      - type: javascript
        value: >-
          !/\b\d[\d,.]*\s?(ms|milliseconds|seconds|rows|records)\b|\bO\((n|N|log|1)/.test(output)
      - type: not-regex
        value: '\b(I|we) (ran|executed|benchmarked|profiled|measured|timed)\b'

  # ----------------------------------------------------------------------------
  - description: 'eval-13 performance-calibration (performance-calibration.ts)'
    prompts: [performance-track]
    vars:
      file: plugins/code-review/evals/fixtures/performance-calibration.ts
    assert:
      - type: regex
        value: '[Nn]ot flagged'
      # a loop over an enum is bounded by the source, not by data
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: n-plus-one, mentions: [broadcast, deliver, Channel] }
      # the read is paginated with `take`/`skip`
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: unbounded-fetch, mentions: [listOrders, 'order\.findMany', skip] }
      # a module-top-level config load is the documented exception
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: blocking-in-async, mentions: [readFileSync, settings] }
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { family: performance }
      - type: javascript
        value: file://checks/report.mjs:notFlaggedNames
        config: { patterns: ['Channel|broadcast', 'listOrders|take|skip', readFileSync], min: 1 }
      - type: javascript
        value: "!/could be slow|may impact performance|might not scale|performance impact/i.test(output)"

  # ----------------------------------------------------------------------------
  - description: 'eval-14 spec-conformance (feature-spec.md vs feature-impl.ts)'
    prompts: [spec-track]
    vars:
      file: plugins/code-review/evals/fixtures/spec/feature-impl.ts
      spec: plugins/code-review/evals/fixtures/spec/feature-spec.md
    assert:
      - type: regex
        value: '`spec`'
      # the bullet quotes the spec line verbatim
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: spec, rule: missing-requirement, severity: high, all: ['Orders whose status is `cancelled` are excluded from the export'] }
      # no code site, so it sits under the spec with the spec's own line
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: spec, rule: missing-requirement, under: feature-spec.md, lines: [7] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: spec, rule: wrong-implementation, severity: high, all: ['Rows are sorted by `created_at`, oldest first'] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: spec, rule: wrong-implementation, under: feature-impl.ts, all: ['L\d+'] }
      # the fix reverses the comparator
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: spec, rule: wrong-implementation, under: feature-impl.ts, fix: 'a\.createdAt.*-\s*b\.createdAt|revers|swap|ascending|oldest' }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: spec, rule: scope-creep, mentions: [exportOrdersGzip, gzip, compress], severity: medium }
      # it quotes the requirement the extra behaviour attaches to
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: spec, rule: scope-creep, mentions: [exportOrdersGzip, gzip, compress], all: ['"[^"]{10,}"'] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: spec, rule: scope-creep, mentions: [exportOrdersGzip, gzip, compress], fix: 'drop|remov|delet|split|separate|own change' }
      - type: regex
        value: '\b3 of 5 requirements met\b'
      # a "met" bullet in the finding shape carries a rule the spec table does not have
      - type: javascript
        value: file://checks/report.mjs:findingsVocabulary
        config: { families: [spec], rules: true }
      # requirements 2 and 5 are met, so they are no finding
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { family: spec, mentions: ['ISO[- ]?8601|toISOString', 'empty (input|array|list|string)'], siteOnly: true }
      # the motivation sentence is not a requirement
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { mentions: [Finance] }

  # ============================================================================
  # Standards track — CODING_STANDARDS.md + .local.md generate `standards` findings
  # ============================================================================

  - description: 'eval-15 standards-pair (standards/service.ts)'
    prompts: [standards-track]
    vars:
      file: plugins/code-review/evals/fixtures/standards/service.ts
    assert:
      - type: regex
        value: '`standards`'
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: standards, mentions: activeAccount, severity: high }
      # the MUST rule quoted verbatim, with its file › section
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: standards, mentions: activeAccount, all: ['Boolean-returning functions MUST be named with an `is`, `has`, or `can` prefix', 'CODING_STANDARDS\.md`? › Naming'] }
      # the fix renames it with the prefix
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: standards, mentions: activeAccount, fix: '\b(is|has|can)[A-Z]\w*' }
      # `.local` relaxes the SHOULD rule, and `.local` wins per statement
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { family: standards, mentions: ['return type'] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: standards, mentions: creditLimitMinor, severity: nit }
      # the MAY rule quoted from the `.local` file
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: standards, mentions: creditLimitMinor, all: ['MAY be supplied with', 'CODING_STANDARDS\.local\.md`? › Defaults'] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: standards, mentions: creditLimitMinor, fix: '\?\?' }
      # a vague line is not a quotable rule
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { mentions: ['clean code'] }
      - type: javascript
        value: file://checks/report.mjs:findingShape
        config: { family: standards, pattern: '^- `standards` · [a-z0-9]+(-[a-z0-9]+)* · (high|medium|nit) · `?[\w./-]*:?L\d+.* — "[^"]+" \(`?CODING_STANDARDS(\.local)?\.md`? › [^)]+\) → .+' }

  # ============================================================================
  # Regression guards — the rules and the scope boundaries added from run analysis
  # ============================================================================

  - description: 'eval-16 iac-exposure-recall (iac-exposure.tf)'
    prompts: [security-track]
    vars:
      file: plugins/code-review/evals/fixtures/iac-exposure.tf
    assert:
      - type: regex
        value: 'iac-exposure'
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: iac-exposure, mentions: [tls_private_key, deploy_key, private_key_pem], severity: high }
      # the plaintext `default` on the variable
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, mentions: [db_admin_password], all: ['default|Sup3rS3cret|plaintext'] }
      # the output that carries it without `sensitive`
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, mentions: [database_admin_password], all: [sensitive] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: iac-exposure, severity: high, all: [allUsers, 'internal_admin|run\.invoker|Cloud Run'] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: iac-exposure, severity: high, all: ['0\.0\.0\.0/0', '5432'] }
      # a condition pinning only the repository admits any workflow or ref of it
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, mentions: [attribute_condition, 'attribute\.repository'] }
      # public by design, a public port, a secret-manager read, a non-credential output
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { family: security, mentions: [objectViewer, marketing, '\b443\b', secret_manager, cluster_endpoint], siteOnly: true }
      - type: javascript
        value: file://checks/report.mjs:notFlaggedNames
        config: { patterns: ['objectViewer|marketing', '\b443\b', 'secret[_ -]manager|stripe', cluster_endpoint] }
      # HANDOFF names another family by design, so only the findings are held to this
      - type: javascript
        value: file://checks/report.mjs:findingsVocabulary
        config: { families: [security], severities: [high, medium], rules: true }
  - description: 'eval-17 access-widening-diff (access-widening.diff)'
    prompts: [security-diff-track]
    vars:
      file: plugins/code-review/evals/fixtures/access-widening.diff
    assert:
      - type: regex
        value: 'access-widening'
      # the required scope widened from `contract:read:own` to `org:read`
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: access-widening, severity: high, all: ['org:read'] }
      # the owner predicate dropped from the store call
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: access-widening, all: [ownerId] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, all: [export, requireAuth] }
      # an injection-sink finding on the interpolated `status` is correct beside it, not a substitute
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: security, rule: access-widening, all: [tenant_id] }
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { family: security, mentions: [requireOwner, 'staging\.acme\.com', '\bcors\b'], siteOnly: true }
      - type: javascript
        value: file://checks/report.mjs:notFlaggedNames
        config: { patterns: [requireOwner, 'staging\.acme\.com|cors'] }
  - description: 'eval-18 guard-test-fidelity-routing (tenant-guard.ts + tenant-guard.test.ts)'
    prompts: [security-track]
    vars:
      file: plugins/code-review/evals/fixtures/tenant-guard.ts plugins/code-review/evals/fixtures/tenant-guard.test.ts
    assert:
      # the guard compares tenants and both queries bind a tenant_id predicate
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { rule: missing-access-check }
      # routed to the tests family in the contract's HANDOFF shape
      - type: regex
        value: '`tests` · test-fidelity'
      # not graded as a security finding of any severity
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { family: security, mentions: ['\.test\.ts', 'test-fidelity', '\btests?\b'], siteOnly: true }
      - type: llm-rubric
        value: >-
          The output says that both tests in `tenant-guard.test.ts` claim a boundary
          their assertions never exercise: each passes the same tenant and asserts only
          that the happy path ran.
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { family: security, atSeverity: high }
  - description: 'eval-19 scope-classification (scope-mix/)'
    prompts: [quality-track]
    vars:
      # Outside fixtures/: scope.md makes everything under a fixtures/ directory `test` kind,
      # which would hide the source-vs-test classification this eval checks.
      file: plugins/code-review/evals/scope-mix
    assert:
      - type: javascript
        value: file://checks/report.mjs:fileReviewed
        config: { files: [build.mjs, legacy-report.cjs] }
      # both are source files, never dismissed as tooling
      - type: javascript
        value: file://checks/report.mjs:notSkipped
        config: { patterns: ['build\.mjs', 'legacy-report'] }
      # a test file outside a `test` directory still gets the tests family
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: tests, under: checkout.spec.ts }
      - type: javascript
        value: file://checks/report.mjs:notSkipped
        config: { patterns: ['checkout\.spec'] }
      # a policy file is the security lens's alone
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { under: ci.yml }
      - type: regex
        value: 'ci\.yml.*(security|[Ss]kipped)|([Ss]kipped|security).*ci\.yml'
      - type: regex
        value: '/security-review'
      - type: javascript
        value: file://checks/report.mjs:skippedNames
        config: { patterns: ['notes\.txt'] }
      - type: regex
        value: '[Ss]kipped'

  - description: 'eval-20 headless-pipeline (cr-prepare → cr-scan × N → cr-merge)'
    prompts: [headless-track]
    vars:
      checkout: plugins/code-review/evals/.sandbox/headless
      context: plugins/code-review/evals/.sandbox/headless-ctx
    # Nine lenses in one agent's context: the default cap would abort mid-run. The skills write
    # their context files; without Write and Bash the agent narrates a review it never ran.
    options: { max_budget_usd: 12, allow_all_tools: true }
    assert:
      - type: javascript
        value: file://checks/headless-pipeline.mjs

  - description: 'eval-21 correctness-recall (correctness/order-sync.ts)'
    prompts: [correctness-track]
    vars:
      # correctness/DEFECTS.md lists the planted defects and look-alikes; the lens never sees it.
      file: plugins/code-review/evals/fixtures/correctness/order-sync.ts
    assert:
      - type: regex
        value: '`correctness`'
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: correctness, rule: off-by-one, mentions: [fetchAllOrders, totalPages], severity: high }
      # the wrong result: the last page is never fetched
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: correctness, rule: off-by-one, mentions: [fetchAllOrders, totalPages], all: ['last'] }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: correctness, rule: off-by-one, mentions: [fetchAllOrders, totalPages], fix: 'page < totalPages(?!\s*-)|<= totalPages - 1' }
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: correctness, rule: swallowed-error, mentions: [syncOrder, 'ledger\.post'], severity: [medium, high] }
      # the caller reads the failure as a success
      - type: javascript
        value: file://checks/report.mjs:finding
        config: { family: correctness, rule: swallowed-error, mentions: [syncOrder, 'ledger\.post'], all: ['ok: true'] }
      # an exhaustive `never` assertion, and best-effort telemetry whose comment says so
      - type: javascript
        value: file://checks/report.mjs:noFinding
        config: { family: correctness, mentions: [labelFor, recordSync], siteOnly: true }
      # a correctness finding is never `nit`
      - type: javascript
        value: file://checks/report.mjs:findingsVocabulary
        config: { severities: [high, medium] }
      # every finding names its own file, so the merge can regroup it
      - type: javascript
        value: file://checks/report.mjs:findingShape
        config: { family: correctness, pattern: '^- `correctness` · [a-z]+(-[a-z]+)* · (high|medium) · `[\w./-]+:L\d+[^`]*` — .+ → .+' }
      - type: javascript
        value: file://checks/handoff-families.mjs

  - description: 'eval-22 prepare-all-skipped (cr-prepare on a docs-only commit)'
    prompts: [headless-prepare-track]
    vars:
      checkout: plugins/code-review/evals/.sandbox/headless-skipped
      context: plugins/code-review/evals/.sandbox/headless-skipped-ctx
    options: { allow_all_tools: true }
    assert:
      - type: javascript
        value: file://checks/prepare-all-skipped.mjs

  - description: 'eval-23 pr-scope (start-cr Step 1 with --pr)'
    prompts: [pr-track]
    vars:
      checkout: plugins/code-review/evals/.sandbox/pr
      gh: plugins/code-review/evals/.sandbox/bin/gh
      pr: 7
      mode: own
    options: { allow_all_tools: true }
    assert:
      - type: javascript
        value: file://checks/pr-scope.mjs

  - description: 'eval-24 pr-reviewer (start-cr Step 1 with --pr on someone else''s PR)'
    prompts: [pr-track]
    vars:
      checkout: plugins/code-review/evals/.sandbox/pr
      gh: plugins/code-review/evals/.sandbox/bin/gh
      pr: 8
      mode: reviewer
    options: { allow_all_tools: true }
    assert:
      - type: javascript
        value: file://checks/pr-scope.mjs

  - description: 'eval-25 headless-lens-list (cr-prepare → one cr-scan over every lens → cr-merge)'
    prompts: [headless-list-track]
    vars:
      checkout: plugins/code-review/evals/.sandbox/headless
      context: plugins/code-review/evals/.sandbox/headless-list-ctx
      list: true
    options: { max_budget_usd: 12, allow_all_tools: true }
    assert:
      - type: javascript
        value: file://checks/headless-pipeline.mjs
