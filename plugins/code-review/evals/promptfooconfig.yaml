# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: code-review plugin — comment verdicts (R1–R12) and quality findings (family · rule · severity)

prompts:
  # Natural-language triggers (not literal "/comment-review" slashes — the Agent SDK reads a
  # leading "/" as a command and rejects it; the skills fire on description match instead).
  # Each test binds to one label, so the two tracks don't cross-run.
  - id: file://prompts/review.txt
    label: comment-track
  - id: file://prompts/quality.txt
    label: quality-track
  # Scanner track: the security / performance / spec lenses have no standalone skill (they
  # exist only inside /start-cr), so these prompts emulate the orchestrator's Scanner
  # brief — read the rules file, review the file, return findings only.
  - id: file://prompts/security.txt
    label: security-track
  - id: file://prompts/performance.txt
    label: performance-track
  - id: file://prompts/spec.txt
    label: spec-track
  # Standards track: quality-review with the fixture dir declared as the repository root
  # for the CODING_STANDARDS pair.
  - id: file://prompts/standards.txt
    label: standards-track

providers:
  - id: anthropic:claude-agent-sdk # alias: anthropic:claude-code
    label: code-review
    config:
      apiKeyRequired: false # use the local Claude Code subscription, no API key for the target
      model: claude-sonnet-4-6 # override per run; a capable model is needed for evals 3/4 to pass
      permission_mode: bypassPermissions # the skill's Read/Grep/Bash run unattended
      allow_dangerously_skip_permissions: true # required alongside bypassPermissions
      working_dir: ../../.. # repo root, so the plugin path and {{file}} paths resolve
      # Per-run cost guard. The quality track needs the higher cap: quality-review reads
      # four rules files plus severity.md and scope.md before it judges, and a $1 cap
      # aborted the calibration test mid-run with an empty result.
      max_budget_usd: 3
      plugins:
        - type: local
          # Resolved relative to THIS config file, not to working_dir: `plugins/code-review`
          # silently loads nothing (no skills, no findings vocabulary) under SDK 0.3.252.
          path: ..
      skills: all
      setting_sources: [] # keep this repo's CLAUDE.md / hooks OUT of the eval
      ask_user_question:
        behavior: first_option # file-path mode shouldn't prompt, but never block if it does

defaultTest:
  options:
    # Grader for llm-rubric. No ANTHROPIC_API_KEY in this environment, so grade on the
    # subscription via the agent SDK (single-turn, no tools). For a faster/cheaper grader,
    # set ANTHROPIC_API_KEY and replace this with:  provider: anthropic:messages:claude-opus-4-8
    provider:
      id: anthropic:claude-agent-sdk
      config:
        apiKeyRequired: false
        model: claude-sonnet-4-6
        max_turns: 1

tests:
  # ============================================================================
  # Comment track — comment-review, verdicts R1–R12
  # ============================================================================

  - description: 'eval-0 banners-and-doc-refs (datadog-integration.tf)'
    prompts: [comment-track]
    vars:
      file: plugins/code-review/evals/fixtures/datadog-integration.tf
    assert:
      # "skill actually ran" proxy: plugin skills load via Agent-Skills injection, not a
      # Skill() tool call, so `skill-used` / metadata.skillCalls stay empty. Assert the
      # report uses the skill's own R1–R12 rule taxonomy instead.
      - type: regex
        value: '\bR(1[0-2]|[1-9])\b'
      - type: llm-rubric
        value: >-
          Flags the top `# ===== Datadog =====` banner as R5 with verdict REMOVE.
      - type: llm-rubric
        value: >-
          Flags `# ----- Provider credentials -----` as R5 REMOVE.
      - type: llm-rubric
        value: >-
          Flags the titled banner `# ----- DD GCP integration — per-env SA + STS
          registration -----` as R5 REMOVE (a descriptive title does not redeem the fence).
      - type: llm-rubric
        value: >-
          Flags `# ----- Metric namespace allowlist -----` as R5 REMOVE.
      - type: llm-rubric
        value: >-
          Flags the `account scoping lives in DD_ARCH.md §3.2` comment under R4
          (internal-doc reference).
      - type: llm-rubric
        value: >-
          Flags the `DD_PLAN.md T4.1` comment under R4 — keeps the "hard-stop is
          intentional" rationale but drops the internal-doc reference.
      - type: llm-rubric
        value: >-
          Keeps `# Retry-After handling per RFC 9110 §10.2.4` (R4 external-pinned-spec
          exception) — it is not flagged for removal.
      - type: llm-rubric
        value: >-
          Keeps the metric-allowlist WHY rationale ("only gcp.* and custom.app.* are
          billed … so an accidental high-cardinality metric can't blow the bill").

  # ----------------------------------------------------------------------------
  - description: 'eval-1 file-refs-and-diagram (scheduler.ts)'
    prompts: [comment-track]
    vars:
      file: plugins/code-review/evals/fixtures/scheduler.ts
    assert:
      - type: regex
        value: '\bR(1[0-2]|[1-9])\b'
      - type: llm-rubric
        value: >-
          Flags the comment that references `utils/backoff.ts` and `docs/scheduling.md`
          under R4 (cross-file / internal-doc references).
      - type: llm-rubric
        value: >-
          Flags `// ----- helpers -----` as R5 REMOVE.
      - type: llm-rubric
        value: >-
          Flags the top `// ===== Scheduler =====` banner as R5 REMOVE.
      - type: llm-rubric
        value: >-
          Flags `// increment the attempt counter` as R1 REMOVE.
      - type: llm-rubric
        value: >-
          Keeps the ASCII state-machine / job-lifecycle diagram (IDLE → QUEUED → RUNNING …)
          — the R5 exception for a diagram that encodes information; it is NOT flagged.
      - type: llm-rubric
        value: >-
          Keeps `// Sequential, not parallel — the broker rate-limits per worker token`
          as a genuine decision/WHY (R2); it is NOT flagged.
      - type: llm-rubric
        value: >-
          Keeps the `CVE-2024-1234` reference (R4 external exception); it is NOT flagged
          for removal.

  # ----------------------------------------------------------------------------
  - description: 'eval-2 misplaced-and-duplicated-rationale (dlq-codes.ts + dlq.handler.ts)'
    prompts: [comment-track]
    vars:
      file: plugins/code-review/evals/fixtures/dlq-codes.ts plugins/code-review/evals/fixtures/dlq.handler.ts
    assert:
      - type: regex
        value: '\bR(1[0-2]|[1-9])\b'
      - type: llm-rubric
        value: >-
          Flags `// the conditional UPDATE can't distinguish a missing row from an
          ineligible status` sitting on the enum member `DLQ_STATUS_NOT_ELIGIBLE` as R12
          (rationale parked on a declaration).
      - type: llm-rubric
        value: >-
          For that enum-member comment the verdict is REMOVE — the same rationale already
          lives at the handler's `updateIfEligible` call, so the declaration copy is the
          redundant/duplicated one.
      - type: llm-rubric
        value: >-
          For the `// we swallow the duplicate …` comment on `DLQ_DUPLICATE_DROPPED` the
          verdict is MOVE — the rationale exists only at the declaration, and the fix names
          the handler method (`handle` / its duplicate branch) as the destination.
      - type: llm-rubric
        value: >-
          Keeps `// 0 means unbounded, not disabled` on the `DLQ_MAX_RETRIES` constant —
          a value-meaning note every reader needs (R12 contrast, not a MOVE/REMOVE).
      - type: llm-rubric
        value: >-
          Keeps the genuine WHY already located at the handler's `updateIfEligible`
          (R2); it is NOT flagged.
      - type: llm-rubric
        value: >-
          Does not flag the bare enum members that carry no comment
          (`DLQ_MESSAGE_RECEIVED`, `DLQ_REQUEUED`).

  # ----------------------------------------------------------------------------
  - description: 'eval-3 spec-id-references (payment-validator.ts)'
    prompts: [comment-track]
    vars:
      file: plugins/code-review/evals/fixtures/payment-validator.ts
    assert:
      - type: regex
        value: '\bR(1[0-2]|[1-9])\b'
      - type: llm-rubric
        value: >-
          Flags `// F1: users can submit a payment with a saved card` as R4 with verdict
          REMOVE.
      - type: llm-rubric
        value: >-
          Flags `// see Q1` as R4 REMOVE (a pure spec-id pointer; nothing survives stripping it).
      - type: llm-rubric
        value: >-
          Flags `// §4.1 caps a single charge at 500_000 minor units` under R4 with a
          verdict of REWRITE *or* REMOVE — both are defensible: once the `§4.1` spec-id
          is stripped, the remainder ("caps a single charge at 500_000 minor units")
          borders on R1 narration of `MAX_CHARGE_MINOR_UNITS = 500_000` + its guard, so a
          strong model may delete it rather than rewrite. It must NOT be kept as-is.
      - type: llm-rubric
        value: >-
          The handling of the `§4.1` comment never retains the token `§4.1` or `4.1`: a
          REWRITE drops it from the replacement text, and a REMOVE (delete the line)
          satisfies this trivially.
      - type: llm-rubric
        value: >-
          Flags `// R7: charge in source order — the ledger rejects out-of-order sequence
          numbers` as R4 REWRITE, keeping the ordering rationale.
      - type: llm-rubric
        value: >-
          The suggested fix for the `R7` comment does NOT contain the token `R7` but keeps
          the ordering meaning ("source order" / "out-of-order").
      - type: llm-rubric
        value: >-
          Flags `/** Implements AC-3 and AC-4. */` as R4 REMOVE (a pure spec-id pointer doc).
      - type: llm-rubric
        value: >-
          Keeps `// Retry-After handling per RFC 9110 §10.2.4` (R4 external-pin exception);
          it is NOT flagged for removal.
      - type: llm-rubric
        value: >-
          Keeps `// region R2 is EU-only; never route US tenants here` — `R2` is a real
          string-literal value (`const REGION = "R2"`), not a spec-id; it is NOT flagged.
      - type: llm-rubric
        value: >-
          Keeps `// sequential, not parallel — the gateway rate-limits per merchant IP`
          as a genuine WHY (R2); it is NOT flagged.
      - type: llm-rubric
        value: >-
          No kept or rewritten comment text in the report retains any spec-id fragment
          (`F1`, `Q1`, `AC-3`, `AC-4`, `§4.1`, `R7`). Quoting the ORIGINAL comment in a
          finding header is fine; the requirement is about the kept/rewritten text.

  # ----------------------------------------------------------------------------
  - description: 'eval-4 spec-id-embedded-midsentence (host-allowlist.ts)'
    prompts: [comment-track]
    vars:
      file: plugins/code-review/evals/fixtures/host-allowlist.ts
    assert:
      - type: regex
        value: '\bR(1[0-2]|[1-9])\b'
      - type: llm-rubric
        value: >-
          All three genuine-WHY comments (the R2 normalize note, the F3/registry note,
          and the §2.3/§2.4 two-pass-validation note) are REWRITE — not a blanket REMOVE,
          and not KEEP-as-is.
      - type: llm-rubric
        value: >-
          No rewritten comment retains the tokens `R2`, `F3`, `Q4`, `§2.3` or `§2.4`.
      - type: llm-rubric
        value: >-
          The ordering / failure-mode rationale of each comment is preserved in its rewrite
          (the WHY survives; only the spec-id token is stripped).
      - type: llm-rubric
        value: >-
          The bare R1 narration line `// hosts are matched case-insensitively` is REMOVE.
      - type: llm-rubric
        value: >-
          The reasoning checks whether each token is a real code value before stripping it,
          rather than rationalizing the spec-id `R2` as a code value.

  # ============================================================================
  # Quality track — quality-review, findings tagged family · rule · severity
  # ============================================================================

  - description: 'eval-5 vocabulary-and-skeleton (quality-vocabulary.ts)'
    prompts: [quality-track]
    vars:
      file: plugins/code-review/evals/fixtures/quality-vocabulary.ts
    assert:
      # "skill actually ran" proxy: the report uses the skill's own family vocabulary.
      - type: regex
        value: '`(readability|tests|naming|module|objects|patterns|simplicity|security|performance|spec|standards)\b'
      - type: llm-rubric
        value: >-
          Flags the local `placedIso` in `buildReceipt` — computed from `order.placedAt`
          but never read and never returned — under the `simplicity` family, rule
          `dead-code`.
      - type: llm-rubric
        value: >-
          That `dead-code` finding is graded severity **high**. It is not downgraded to
          `medium` or `nit` on the grounds that the file is otherwise small, tidy, or
          correct.
      - type: llm-rubric
        value: >-
          Every severity in the report is exactly one of `high`, `medium`, or `nit` — the
          word "low", a numeric score, or an invented severity word appears nowhere.
      - type: llm-rubric
        value: >-
          If the report flags `openness` (blocks jammed together with no blank line) at
          more than one site, those sites are collapsed into a SINGLE bullet listing the
          lines together (e.g. "L20, L34, L51") rather than repeated as one bullet per
          site.
      - type: llm-rubric
        value: >-
          The report carries an explicit `**Headline:**` line, and it does NOT call the
          change clean, well-structured, or cosmetic-nits-only — a high-severity finding
          exists, so the headline names the worst problem instead.
      - type: llm-rubric
        value: >-
          The report follows the skill's fixed skeleton: it opens with a `**Conventions:**`
          line and a `**Headline:**` line, its `###` headers are FILE PATHS (not
          "Findings", "Finding 1", or a family name), and each finding is a single
          markdown bullet rather than a numbered or bolded entry block.
      - type: llm-rubric
        value: >-
          The report body contains NO fenced code blocks and no before/after listing, and
          no suggested fix pastes a multi-line rewritten function body. (The skill allows
          at most a short inline expression inside backticks when a fix cannot be named
          without one, so a single inline expression does NOT fail this assertion —
          a fenced block or a multi-line rewrite does.)

  # ----------------------------------------------------------------------------
  - description: 'eval-6 recall-across-families (quality-recall.ts)'
    prompts: [quality-track]
    vars:
      file: plugins/code-review/evals/fixtures/quality-recall.ts
    assert:
      - type: regex
        value: '`(readability|tests|naming|module|objects|patterns|simplicity|security|performance|spec|standards)\b'
      - type: llm-rubric
        value: >-
          Flags the duplication between `renderInvoiceLine` and `renderCreditNoteLine`
          (identical bodies differing only by the literal label "INVOICE" vs
          "CREDIT NOTE") as `simplicity` · `over-complex`, severity **high**, and the fix
          collapses them into one function taking the label as a parameter.
      - type: llm-rubric
        value: >-
          Flags the bare `86400 * 30` in `findOverdueInvoices` as `readability` ·
          `magic-literal`, severity **medium**, proposing a name for the 30-day overdue
          window.
      - type: llm-rubric
        value: >-
          Flags the local `currencyMap` in `groupByCurrency` as `naming` · `role-name`,
          severity **nit** — the name carries the type (`Map`) instead of the role.
      - type: llm-rubric
        value: >-
          All three problems above are present in the report. Missing any one of them
          fails this assertion, regardless of how well the others are described.

  # ----------------------------------------------------------------------------
  - description: 'eval-7 calibration-look-alikes (quality-calibration.ts)'
    prompts: [quality-track]
    vars:
      file: plugins/code-review/evals/fixtures/quality-calibration.ts
    assert:
      # This fixture is deliberately clean, so a family tag may be absent from a collapsed
      # report. Use the skeleton's tally line as the "skill actually ran" proxy instead.
      - type: regex
        value: '[Tt]ally'
      - type: llm-rubric
        value: >-
          Does NOT flag `JSON.parse(raw) as Config` in `parseConfig` as `needless-cast` —
          narrowing an `unknown` boundary is the rule's documented exception.
      - type: llm-rubric
        value: >-
          Does NOT flag the `default:` branch of the `switch` in `area` as `dead-code` —
          an intentionally exhaustive default kept as a defensive assertion is the rule's
          documented exception.
      - type: llm-rubric
        value: >-
          Does NOT flag the arithmetic in `median` (`Math.floor(sorted.length / 2)`,
          `% 2 === 1`, `sorted[middle - 1]`) as `magic-literal` — these are
          self-evidently themselves, not domain constants.
      - type: llm-rubric
        value: >-
          Does NOT flag `items.length > 0` in `hasResults` as `explaining-variable` — the
          expression is already idiomatic and plain.
      - type: llm-rubric
        value: >-
          Does NOT flag the two-branch conditional in `describeStock` as `guard-clause` —
          both arms do real, comparable work, which the rule documents as a legitimate
          `if/else` rather than a guard plus body.
      - type: llm-rubric
        value: >-
          The overall verdict is clean: the report has no high or medium findings. Any
          look-alike the review considered and passed on is named on the "Not flagged"
          line rather than raised as a finding.

  # ----------------------------------------------------------------------------
  - description: 'eval-8 folded-rules-recall (quality-recall-2.ts + quality-recall-2.model.ts)'
    prompts: [quality-track]
    vars:
      file: plugins/code-review/evals/fixtures/quality-recall-2.ts plugins/code-review/evals/fixtures/quality-recall-2.model.ts
    assert:
      - type: regex
        value: '`(readability|tests|naming|module|objects|patterns|simplicity|security|performance|spec|standards)\b'
      - type: llm-rubric
        value: >-
          Flags the module-local `fetchInvoice` in `quality-recall-2.ts` — it forwards
          `(repo, id)` unchanged to `repo.findById(id)` and has one caller (`collect`) —
          as `module` · `pass-through`, severity **medium**, with a fix that inlines the
          call at the caller and deletes the wrapper.
      - type: llm-rubric
        value: >-
          Flags the file-local `renderAmount` in `quality-recall-2.ts` as `module` ·
          `canonical-helper`, severity **high** — it duplicates the exported `formatMoney`
          in `quality-recall-2.model.ts` (same `(amountMinor / 100).toFixed(2)` + currency
          expression) — and the fix imports `formatMoney` instead. It is NOT filed as
          `simplicity` · `over-complex` (that rule is for same-file duplication).
      - type: llm-rubric
        value: >-
          Raises an `objects` · `feature-envy` finding, severity **medium**, on
          `CollectionsQueue` — on ANY of `totalOf`, `priorityOf`, or `labelFor` (naming
          one of them is enough): they compute the invoice total / days overdue from
          `Invoice`'s own fields (`lines`, `dueAt`, `isSettled`) while `Invoice` has
          behaviour of its own — and the fix moves that computation onto `Invoice`
          (e.g. `total()`, `daysOverdue(now)`). A report that clears it as a
          mapper/serializer exception fails this assertion.
      - type: llm-rubric
        value: >-
          Flags `invoice.customer().account().primaryContact().email` in
          `CollectionsQueue.recipientFor` as `objects` · `message-chain`, severity
          **medium**, with a fix that asks `Invoice` (or `Customer`) for the answer
          directly instead of navigating three foreign objects.
      - type: llm-rubric
        value: >-
          All four problems above (`pass-through`, `canonical-helper`, `feature-envy`,
          `message-chain`) are present in the report. Missing any one of them fails this
          assertion, regardless of how well the others are described.

  # ----------------------------------------------------------------------------
  - description: 'eval-9 folded-rules-calibration (quality-calibration-2.ts + quality-calibration-2.types.ts)'
    prompts: [quality-track]
    vars:
      file: plugins/code-review/evals/fixtures/quality-calibration-2.ts plugins/code-review/evals/fixtures/quality-calibration-2.types.ts
    assert:
      # Deliberately clean fixture — proxy on the skeleton's tally line, as in eval-7.
      - type: regex
        value: '[Tt]ally'
      - type: llm-rubric
        value: >-
          Does NOT flag `OrderDtoMapper.toDto` as `feature-envy` — a DTO mapper reads
          another object's fields because that is its job (the rule's documented
          exception).
      - type: llm-rubric
        value: >-
          Does NOT flag the `new OrderQuery().where(...).where(...).limit(...).build()`
          chains in `OrdersController.list` / `find` as `message-chain` — a fluent builder
          / `this`-returning chain is the rule's documented exception.
      - type: llm-rubric
        value: >-
          Does NOT flag `PaymentGateway.chargeOrder` as `pass-through` — it adapts the
          call (translates `Order` into Stripe's `{ amount, currency }` shape and lowers the
          currency) at a real boundary, which the rule documents as a facade, not a
          forwarder.
      - type: llm-rubric
        value: >-
          Does NOT flag the `import type` pair between `quality-calibration-2.ts` and
          `quality-calibration-2.types.ts` as `dependency-direction` — erased, type-only
          imports are the rule's documented exception, even though they form a cycle.
      - type: llm-rubric
        value: >-
          Does NOT flag the repeated `(req: Request, res: Response)` signatures of
          `OrdersController.get`, `list`, `charge` as `data-clump` — a framework-fixed
          signature is the rule's documented exception.
      - type: llm-rubric
        value: >-
          The overall verdict is clean: the report has no high or medium findings. Any
          look-alike the review considered and passed on is named on the "Not flagged"
          line rather than raised as a finding.

  # ============================================================================
  # Scanner track — security / performance / spec, prompts that emulate the
  # /start-cr Scanner brief (these lenses have no standalone skill)
  # ============================================================================

  - description: 'eval-10 security-recall (security-recall.ts)'
    prompts: [security-track]
    vars:
      file: plugins/code-review/evals/fixtures/security-recall.ts
    assert:
      # "scanner actually ran" proxy: findings carry the lens's own family tag.
      - type: regex
        value: '`security`'
      - type: llm-rubric
        value: >-
          Flags the `sk_live_…` literal used as the `process.env.STRIPE_SECRET` fallback
          (L7) as `security` · `secret-in-source`, severity **high**. The fix reads the
          value from the environment or a secret module, and the finding says rotation of
          the committed value is the user's step — it never claims rotation is done.
      - type: llm-rubric
        value: >-
          Flags the `listOrders` handler as `security` · `injection-sink`, severity
          **high**, naming BOTH ends by line: where `req.query.status` enters (L12) and
          the sink where it is interpolated into the `pool.query(...)` SQL string (L13).
          The fix binds the value through a `$1`/placeholder parameter.
      - type: llm-rubric
        value: >-
          Flags `rejectUnauthorized: false` on the `https.Agent` (L9) as `security` ·
          `insecure-setting`, severity **high**, naming both the setting line and the
          request it weakens (the `https.request` to `api.stripe.com` that passes
          `agent: gatewayAgent`). The fix restores certificate verification.
      - type: llm-rubric
        value: >-
          All three problems above (`secret-in-source`, `injection-sink`,
          `insecure-setting`) are present. Missing any one of them fails this assertion.
      - type: llm-rubric
        value: >-
          Every severity in the output is exactly `high` or `medium` — never `nit`, never
          `low`, never `critical`, never a number — and each finding is a single bullet in
          the `` `security` · rule · severity · L<lines> — … → … `` shape with no fenced
          code block and no rewritten function body.

  # ----------------------------------------------------------------------------
  - description: 'eval-11 security-calibration (security-calibration.ts)'
    prompts: [security-track]
    vars:
      file: plugins/code-review/evals/fixtures/security-calibration.ts
    assert:
      # Clean fixture — the prompt asks for a `Not flagged:` line, so proxy on it.
      - type: regex
        value: '[Nn]ot flagged'
      - type: llm-rubric
        value: >-
          Does NOT flag `db.raw('SELECT … WHERE email = ?', [email])` in `findUserByEmail`
          as `injection-sink` — a parameterized builder with a bound `?` placeholder is the
          rule's documented exception.
      - type: llm-rubric
        value: >-
          Does NOT flag `spawn('convert', [uploadPath, …])` in `resizeUpload` as
          `injection-sink` — `spawn` with an argv array and no shell is the rule's
          documented exception.
      - type: llm-rubric
        value: >-
          Does NOT flag the `sk_test_…` literal assigned to `stripeTestKey` as
          `secret-in-source` — an obviously fake `sk_test_` value in a fixture file is
          the rule's documented exception.
      - type: llm-rubric
        value: >-
          Does NOT flag the `SENDGRID_API_KEY` environment read (into `sendgridKey`, sent
          as a bearer header) as `secret-in-source` — an environment read is the rule's
          documented exception.
      - type: llm-rubric
        value: >-
          Does NOT flag the `health` handler as `missing-access-check` — a deliberately
          public health endpoint is the rule's documented exception.
      - type: llm-rubric
        value: >-
          The output raises NO finding in the `` `security` · rule · severity `` shape at
          all; every look-alike it considered is named on the `Not flagged` line (a
          `CANDIDATES` entry for the `sk_test_` literal is tolerated, a finding is not).

  # ----------------------------------------------------------------------------
  - description: 'eval-12 performance-recall (performance-recall.ts)'
    prompts: [performance-track]
    vars:
      file: plugins/code-review/evals/fixtures/performance-recall.ts
    assert:
      - type: regex
        value: '`performance`'
      - type: llm-rubric
        value: >-
          Flags the per-order `prisma.customer.findUnique` inside the `for` loop of
          `pendingOrdersWithCustomers` as `performance` · `n-plus-one`, severity **high**.
      - type: llm-rubric
        value: >-
          That `n-plus-one` finding names all four evidence items: (1) the multiplier —
          the `orders` list returned by `prisma.order.findMany` (sized by data); (2) the
          call inside it — `findUnique` per order; (3) the missing bound — one batched
          read before the loop; (4) the batch API that already exists in the file —
          `findMany({ where: { id: { in } } })` as used by `customersByIds` (or an
          `include` on the outer query).
      - type: llm-rubric
        value: >-
          Flags the `prisma.event.findMany` in the `listEvents` route handler as
          `performance` · `unbounded-fetch`, severity **medium** — no `take`/cursor on a
          growing table, returned whole from a list endpoint that accepts no page
          parameter — with a fix that adds `take` plus a cursor/page parameter.
      - type: llm-rubric
        value: >-
          Both problems above (`n-plus-one` and `unbounded-fetch`) are present. Missing
          either fails this assertion.
      - type: javascript
        value: "!/could be slow|may impact performance|might not scale|performance impact/i.test(output)"
      - type: llm-rubric
        value: >-
          No finding carries a latency, a row count, a complexity class, or any other
          estimate not derived from a line in the file, and the scanner never claims to
          have run, benchmarked, or profiled the code.

