          in `feature-impl.ts` filters on `status`. The bullet quotes that spec line and
          sits under a `### plugins/code-review/evals/fixtures/spec/feature-spec.md`
          header with the spec's own line number (L7), not under the code file.
      - type: llm-rubric
        value: >-
          Flags the sort comparator in `exportOrders` (`b.createdAt - a.createdAt`, newest
          first) as `spec` · `wrong-implementation`, severity **high**, quoting spec line
          4 — "Rows are sorted by `created_at`, oldest first." — under the code file's
