          ("Boolean-returning functions MUST be named with an `is`, `has`, or `can`
          prefix.") and citing `CODING_STANDARDS.md › Naming`; the fix renames it (e.g.
          `isActiveAccount`).
      - type: llm-rubric
        value: >-
