name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: find . -name '*.sh' -not -path './.git/*' | xargs shellcheck

  codex-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Codex plugin packages
        run: ./scripts/check-codex-plugins.sh

  verify-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check manifests, marketplace and copied files
        run: node scripts/verify-plugins.mjs

  plugin-validate-test:
    runs-on: ubuntu-latest
    env:
      # Same version plugin-evals.yml pins, so validation matches the evals' runtime.
      CLAUDE_CODE_VERSION: 2.1.322
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the marketplace and every plugin
        run: |
          claude plugin validate .claude-plugin/marketplace.json --strict
          # Not --strict: it turns the mods' TypeScript warnings into failures, including TS5097 on the
          # '.ts' import paths the mod loader requires.
          for d in plugins/*/; do claude plugin validate "$d"; done
      - name: Run mod tests
        run: |
          for d in plugins/*/; do
            [ -d "$d/tests" ] && [ -f "$d/hooks/hooks.json" ] || continue
            echo "::group::$d"
            claude plugin test "$d"
            echo "::endgroup::"
          done

  no-fixup-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on unsquashed fixup commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fixups=$(git log --format='%h %s' "$BASE_SHA..$HEAD_SHA" | grep -E '^[0-9a-f]+ (fixup|squash|amend)! ' || true)
          if [ -n "$fixups" ]; then
            echo "$fixups"
            echo "::error::Squash these before merging: git rebase --autosquash origin/main && git push --force-with-lease"
            exit 1
          fi
