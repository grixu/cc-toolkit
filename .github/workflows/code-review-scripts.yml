name: code-review scripts

on:
  pull_request:
    paths:
      - 'plugins/code-review/scripts/**'
      - '.github/workflows/code-review-scripts.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      # The suite builds real git repositories and sets their identity itself, so no git config is needed here.
      - name: Run tests
        run: python -m pytest plugins/code-review/scripts/tests
