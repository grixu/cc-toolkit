name: Plugin evals (anti-slop, code-story)

on:
  pull_request:
    paths:
      - 'plugins/anti-slop/**'
      - 'plugins/code-story/**'
      # anti-slop's embedded-output-only case is the contract pr-open relies on.
      - 'plugins/dev-kit/skills/pr-open/**'
      - '.github/workflows/plugin-evals.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.322
  # The suites were calibrated on this model; pinning it keeps a model rollout from reading as a regression.
  EVAL_MODEL: claude-opus-5-5

jobs:
  changes:
    runs-on: ubuntu-latest
    # Fork PRs get no secrets, so there is nothing to run the agent with.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'suites=["anti-slop","code-story"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          has() { grep -qE "$1" <<< "$changed"; }
          suites=()
          if has '^(plugins/anti-slop/|plugins/dev-kit/skills/pr-open/|\.github/workflows/plugin-evals\.yml$)'; then
            suites+=('"anti-slop"')
          fi
          # code-story's case loads anti-slop, so an anti-slop change can break it too.
          if has '^(plugins/code-story/|plugins/anti-slop/|\.github/workflows/plugin-evals\.yml$)'; then
            suites+=('"code-story"')
          fi
          echo "suites=[$(IFS=,; echo "${suites[*]}")]" >> "$GITHUB_OUTPUT"

  eval:
    needs: changes
    if: needs.changes.outputs.suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    env:
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      # code-story's assemble.mjs and check.mjs run under the granted Bash.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A granted Bash runs under the Claude Code sandbox, which needs bubblewrap and socat on Linux;
      # Ubuntu 24.04's AppArmor policy otherwise stops bwrap from creating its user namespace.
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          git --version
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run ${{ matrix.suite }} evals
        env:
          # Runs on a subscription OAuth token (`claude setup-token`), not a metered API key.
          # Scoped to this step so no other step, and nothing it installs, can read it.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --version
          out="$RUNNER_TEMP/eval-$SUITE"
          case "$SUITE" in
            anti-slop)
              # One case is known to score 0.83 on a flaky run.
              args=(plugins/anti-slop --threshold 0.8 --max-cost-usd 15
                --allow-tools Bash Write Edit) ;;
            code-story)
              # Repo root as target: a case may only load plugins under it, and this one loads anti-slop.
              args=(. --eval-dir plugins/code-story/evals --ablation none --threshold 1.0 --max-cost-usd 10
                --allow-tools Bash Write Edit ToolSearch 'mcp__code-story__*') ;;
            *) echo "unknown suite: $SUITE" >&2; exit 1 ;;
          esac
          set +e
          claude plugin eval "${args[@]}" \
            --scaffold --trust-plugin --no-publish --keep-temp \
            --model "$EVAL_MODEL" \
            --output-dir "$out" \
            --report "$out/report.html" \
            --json "$out/results.json"
          rc=$?
          set -e
          # results.json points each run at /tmp/claude-eval-*; without its trace and workspace a failure cannot be read.
          mkdir -p "$out/runs"
          for d in /tmp/claude-eval-*/; do
            [ -d "$d" ] && cp -r "$d" "$out/runs/" || true
          done
          # The artifact is readable by anyone who can see the repo, so never ship a run that captured the token.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && grep -rqF -- "$CLAUDE_CODE_OAUTH_TOKEN" "$out/runs"; then
            echo "::warning::a run captured the OAuth token; dropping the run directories from the artifact"
            rm -rf "$out/runs"
          fi
          exit "$rc"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-eval-results
          path: ${{ runner.temp }}/eval-${{ matrix.suite }}/
          if-no-files-found: ignore
          # Workspaces keep the story under .scratch/ and the fixture repo's .git.
          include-hidden-files: true
